waterbodies:
  # ── Los Lagos ──
  rio-petrohue:
    - species: "Salmón chinook"
      months:
        11: { fly: "Primeros peces plateados; two-hand 8-9, T-11/T-14, Intruders oscuros.", spin: "Spoons 30 g; pozones bajos. Prohibido motor encendido en todo el río." }
        1:  { fly: "Corrida en aumento; sectores medios entre los saltos y la desembocadura.", spin: "Spoons 30-40 g verde/chartreuse, recogida lenta y profunda." }
        2:  { fly: "Temporada alta; buscar agua de 1-2 m con corriente media.", spin: "Ídem enero; sólo 1 salmón de retención por jornada." }
        3:  { fly: "Peces coloreados, aún entran frescos con lluvias.", spin: "Considerar devolución de peces oscuros." }
        4:  { fly: "Final de corrida; truchas grandes detrás de los desoves con perdigones y glo-bugs.", spin: "Giratorias #4 cobre." }
      notes: "Corrida documentada de diciembre a abril; sector Los Patos cerrado."
    - species: "Trucha arcoíris y café"
      months:
        11: { fly: "Ninfas pesadas en canaletas de lava; streamers olive.", spin: "Minnows hundidos; el agua es siempre fría y turquesa (glaciar)." }
        12: { fly: "Secas atractoras (Chernobyl, Stimulator) con caída de tábanos.", spin: "Giratorias #3." }
        1:  { fly: "Dry-dropper; truchas asociadas a estructura de lava.", spin: "Lures pequeños, primeras horas." }
        3:  { fly: "Streamers y ninfas grandes; cafés agresivas.", spin: "Minnows más grandes." }
  rio-puelo:
    - species: "Salmón chinook / coho / salar"
      months:
        9:  { fly: "Apertura anticipada (¡sólo devolución!): streamers grandes en pozones, swing profundo.", spin: "Spoons pesados con anzuelo simple sin rebarba; todo se devuelve." }
        11: { fly: "Desde el 2° viernes: retención de 1 salmón; two-hand en el sector bajo (Reloncaví).", spin: "Spoons 30-40 g cerca del estuario." }
        1:  { fly: "Chinook en el valle; salar/coho de escape cerca de la desembocadura.", spin: "Trolling liviano en el estuario donde esté permitido." }
        2:  { fly: "Temporada alta del chinook aguas arriba (sector Tagua Tagua).", spin: "Spoons XL en pozones profundos." }
        3:  { fly: "Últimos frescos; truchas grandes comiendo huevos.", spin: "Giratorias cobre." }
      notes: "Temporada extendida hasta el 31 de mayo (cuenca Puelo/Rahue)."
    - species: "Trucha arcoíris y café"
      months:
        12: { fly: "Agua turquesa grande: streamers con sink-tip desde bote; dries en orillas.", spin: "Minnows 9-11 cm." }
        2:  { fly: "Terrestres en las orillas con viento; café grandes en estructura.", spin: "Lures naturales, atardecer." }
        4:  { fly: "Streamers agresivos pre-desove.", spin: "Spoons cobre/naranja." }
  rio-maullin:
    - species: "Salmón chinook / coho"
      months:
        12: { fly: "Entran los primeros chinook desde el estuario; swing con Intruders en pozones lentos.", spin: "Spoons pesados en el curso bajo (Las Quemas, Lolcura)." }
        1:  { fly: "Corrida plena; río lento — buscar canales profundos.", spin: "Trolling lento con rapalas hundidos donde esté permitido." }
        2:  { fly: "Ídem; coho cerca de la barra en otoño temprano.", spin: "Spoons plateados." }
      notes: "Prohibida la pesca desde puentes; retención de 1 salmón desde nov."
    - species: "Trucha arcoíris y café"
      months:
        9:  { fly: "C&R primaveral: streamers y ninfas en la salida del lago Llanquihue.", spin: "Giratorias con anzuelo simple sin rebarba (obligatorio)." }
        12: { fly: "Río de llanura tipo spring creek: secas al rise en tardes calmas.", spin: "Lures chicos, presentación silenciosa." }
        2:  { fly: "Terrestres y damseles en los remansos con vegetación.", spin: "Primeras/últimas horas." }
  lago-llanquihue:
    - species: "Salar / coho / chinook (harling y orilla)"
      months:
        9:  { fly: "Apertura C&R: streamers smolt sobre veriles y bocas (a >1.000 m de desembocaduras).", spin: "Harling con cucharas plateadas; devolución obligatoria hasta nov." }
        11: { fly: "Retención de 1 salmón desde el 2° viernes; línea hundida sobre los veriles.", spin: "Trolling al amanecer frente a Ensenada y bocas de ríos." }
        1:  { fly: "Peces profundos; shooting heads tipo 7.", spin: "Trolling con downrigger liviano." }
        5:  { fly: "Extensión de mayo (si se renueva): C&R, streamers en bocas.", spin: "C&R; cucharas plateadas." }
    - species: "Trucha arcoíris y café"
      months:
        10: { fly: "Dragones y damseles cerca de bahías con vegetación.", spin: "Giratorias #3 desde orilla en puntas rocosas." }
        1:  { fly: "Secas al atardecer en bahías calmas; caídas de hormigas.", spin: "Lures naturales al amanecer." }
  rio-futaleufu:
    - species: "Trucha arcoíris y café"
      months:
        11: { fly: "Apertura (1 nov, provincia de Palena): ninfas pesadas en agua turquesa grande.", spin: "Minnows hundidos; cuidado con los rápidos clase V." }
        12: { fly: "Secas atractoras grandes desde bote; arcoíris muy agresivas.", spin: "Giratorias #4." }
        1:  { fly: "Dry-dropper en canaletas laterales; tramo superior (límite a Sofía) es C&R.", spin: "Lures medianos; C&R en el tramo superior." }
        2:  { fly: "Terrestres XXL (Fat Albert); mejor luz dura de mediodía.", spin: "Ídem enero." }
        3:  { fly: "Streamers para cafés grandes.", spin: "Minnows 11 cm." }
  rio-palena:
    - species: "Trucha arcoíris y café + chinook"
      months:
        11: { fly: "Flotadas largas: streamers a la orilla desde bote.", spin: "Minnows; el chinook entra desde diciembre." }
        1:  { fly: "Secas y dry-dropper en brazos laterales; chinook en pozones profundos.", spin: "Spoons grandes para chinook, giratorias para trucha." }
        3:  { fly: "Cafés migratorias grandes con streamers articulados; chinook coloreado.", spin: "Minnows XL, colores otoño." }
  rio-yelcho:
    - species: "Chinook + trucha"
      months:
        12: { fly: "Chinook fresco desde el estuario; two-hand con T-14.", spin: "Spoons 40 g en la desembocadura y pozones bajos." }
        1:  { fly: "Corrida plena; también arcoíris grandes detrás.", spin: "Ídem; retención sólo 1 salmón." }
        2:  { fly: "Chinook + secas para trucha en tardes calmas.", spin: "Spoons y minnows." }
  lago-yelcho:
    - species: "Trucha arcoíris y café"
      months:
        11: { fly: "Apertura: streamers sobre los veriles del desagüe.", spin: "Trolling liviano con cucharas." }
        1:  { fly: "Caída de tábanos (enero-febrero): secas grandes flotando quietas — pesca icónica del Yelcho.", spin: "Lures de superficie al atardecer." }
        2:  { fly: "Tábanos aún; luego dragones en bahías.", spin: "Giratorias en bocas de ríos." }
  # ── Los Ríos ──
  rio-san-pedro:
    - species: "Trucha café y arcoíris (+ chinook de paso)"
      months:
        10: { fly: "Apertura regional (2° viernes oct): ninfas y streamers; el río sale del Riñihue con agua clara.", spin: "Minnows suspending; cafés grandes tempraneras." }
        12: { fly: "Secas caddis al atardecer; flotadas — el tramo alto es sólo mosca y C&R.", spin: "Giratorias #3 en el tramo libre (bajo la confluencia con el Malihue)." }
        2:  { fly: "Terrestres en orillas con sauces; tippet fino.", spin: "Lures chicos al amanecer." }
        4:  { fly: "Streamers grandes: cafés migratorias del Riñihue.", spin: "Minnows XL." }
      notes: "Ojo: el tramo alto (nacimiento en el Riñihue hasta el Malihue) es C&R con mosca — regla específica."
  rio-calcurrupe:
    - species: "Trucha (+ chinook al Ranco)"
      months:
        10: { fly: "Apertura oct (regla regional tras expirar el C&R decenal): streamers en la corriente central.", spin: "Giratorias #3-4; flotadas de Llifén a la barra." }
        1:  { fly: "Secas en tardes; arcoíris de lago suben con agua fresca.", spin: "Minnows naturales." }
        3:  { fly: "Cafés grandes del Ranco pre-desove: streamers articulados; chinook ocasional.", spin: "Spoons cobre." }
  lago-ranco:
    - species: "Trucha arcoíris y café"
      months:
        10: { fly: "Bocas de ríos (a distancia legal): smolt patterns.", spin: "Trolling en rinconadas; cucharas plateadas." }
        1:  { fly: "Dragones sobre veriles; secas en calmas de tarde.", spin: "Giratorias desde orilla en puntillas." }
        3:  { fly: "Streamers cerca de las bocas (Calcurrupe, Nilahue).", spin: "Minnows hundidos." }
  rio-fuy:
    - species: "Trucha arcoíris y café"
      months:
        10: { fly: "Pocket water: ninfas cortas de tirada; agua muy clara.", spin: "Giratorias #2 en pozones entre bolones." }
        12: { fly: "Atractoras (Royal Wulff, Stimulator) en agua rápida.", spin: "Lures chicos." }
        2:  { fly: "Terrestres; sombras del bosque valdiviano.", spin: "Primeras horas." }
  # ── La Araucanía ──
  rio-tolten:
    - species: "Salmón chinook"
      months:
        10: { fly: "Si la resolución 2026-27 se renueva (hist. desde 15 sep): swing profundo en pozones de Villarrica a Pitrufquén.", spin: "Spoons 30-40 g; la corrida del Toltén es la más al norte establecida en Chile." }
        12: { fly: "Corrida plena; two-hand 9-10.", spin: "Ídem; retención según resolución vigente." }
        2:  { fly: "Peces grandes coloreándose; frescos con lluvias.", spin: "Spoons chartreuse." }
    - species: "Trucha arcoíris y café"
      months:
        11: { fly: "Ninfas en correderas; streamers en orillas con troncos.", spin: "Minnows 7-9 cm." }
        1:  { fly: "Secas caddis/mayfly al atardecer.", spin: "Giratorias, tarde." }
  rio-trancura:
    - species: "Trucha arcoíris y café"
      months:
        11: { fly: "Ninfas de stonefly pesadas en agua rápida.", spin: "Giratorias #3 en pozones entre rápidos (compartidos con rafting)." }
        12: { fly: "Atractoras grandes con dropper.", spin: "Lures medianos, sectores altos." }
        2:  { fly: "Terrestres: saltamontes en orillas ganaderas.", spin: "Amanecer/atardecer." }
  rio-liucura:
    - species: "Trucha arcoíris y café"
      months:
        11: { fly: "Río técnico y claro: ninfas finas, líderes largos.", spin: "Lures pequeños, aproximación sigilosa." }
        1:  { fly: "Secas paracaídas #16-18; rises selectivos en tardes.", spin: "Micro-spoons." }
        3:  { fly: "Streamers chicos olive; cafés de Caburgua.", spin: "Giratorias #2." }
  lago-villarrica:
    - species: "Trucha + chinook de paso"
      months:
        11: { fly: "Streamers sobre veriles frente a Pucón.", spin: "Trolling con cucharas; jerkbaits en rinconadas." }
        1:  { fly: "Dragones y secas en bahías al atardecer.", spin: "Trolling al amanecer." }
  lago-caburgua:
    - species: "Trucha arcoíris y café"
      months:
        12: { fly: "Agua muy clara y profunda: líneas de hundimiento sobre veriles; damseles cerca de juncos.", spin: "Cucharas plateadas, trolling lento profundo." }
        2:  { fly: "Caídas de hormigas voladoras: secas pequeñas.", spin: "Lures naturales al atardecer." }
  # ── Aysén ──
  rio-simpson:
    - species: "Trucha arcoíris y café"
      months:
        10: { fly: "Apertura C&R (12 oct): ninfas y streamers olive; agua alta.", spin: "Giratorias; todo con devolución hasta el 30 nov (regla de ríos Aysén)." }
        12: { fly: "El clásico: caddis al atardecer — uno de los mejores dry-fly de Chile.", spin: "Minnows chicos; retención permitida dic-feb." }
        1:  { fly: "Secas y dry-dropper todo el día; tramos urbanos a cordillera.", spin: "Lures naturales." }
        3:  { fly: "C&R otra vez desde el 1 mar: streamers para cafés grandes.", spin: "Devolución obligatoria." }
  rio-aysen:
    - species: "Salmón chinook"
      months:
        10: { fly: "Desde el 12 oct (retención 2): swing con Intruders en el sector La Barra.", spin: "Spoons 40 g; zona de extensión = desembocadura a confluencia río Blanco." }
        11: { fly: "Corrida plena nov-dic.", spin: "Ídem." }
        1:  { fly: "Retención hasta el 15 ene (o extensión vigente); después devolución.", spin: "Revisar resolución del año." }
  rio-manihuales:
    - species: "Chinook + trucha café"
      months:
        11: { fly: "Chinook en pozones; cafés con streamers en orillas con palizada.", spin: "Spoons para chinook, giratorias para trucha." }
        1:  { fly: "Secas en tardes; chinook coloreándose.", spin: "Minnows." }
      notes: "Sector El Toqui: zona de protección de desove — prohibida la extracción todo el año."
  rio-nirehuao:
    - species: "Trucha café (pampa)"
      months:
        12: { fly: "Río de pampa: saltamontes y Fat Alberts contra las barrancas.", spin: "Lures chicos aguas abajo; viento constante." }
        2:  { fly: "Temporada alta de terrestres; cafés selectivas en pozones lentos.", spin: "Micro-spoons, aproximación baja." }
      notes: "Sector Mañihuales: zona de desove protegida todo el año."
  rio-cisnes:
    - species: "Trucha café y arcoíris"
      months:
        11: { fly: "Streamers en el cañón medio; agua con color glaciar.", spin: "Giratorias #3." }
        1:  { fly: "Terrestres en la estepa alta; secas atractoras abajo.", spin: "Lures naturales." }
  rio-baker:
    - species: "Trucha arcoíris (+ chinook)"
      months:
        10: { fly: "Volumen enorme y turquesa: streamers muy pesados con T-17 en contracorrientes.", spin: "Spoons 30-40 g — el spinning rinde especialmente aquí." }
        12: { fly: "Ninfas grandes bajo indicador en remansos; arcoíris de 2-4 kg.", spin: "Minnows XL cerca de confluencias (Chacabuco, Cochrane)." }
        2:  { fly: "Secas grandes en brazos laterales y desagües.", spin: "Giratorias #5." }
        4:  { fly: "C&R (desde mar): streamers; chinook coloreado en pozones.", spin: "Devolución obligatoria." }
  lago-general-carrera:
    - species: "Trucha arcoíris y café"
      months:
        10: { fly: "Apertura de lagos (12 oct, C&R hasta el 9 nov): streamers en desagües y bocas.", spin: "Trolling con cucharas; el lago más grande de Chile — buscar bahías." }
