# Canonical registry of water bodies shown on the map.
# id: stable slug used by regulations yaml and geometry filenames.
# osm_name: exact `name` tag to query in Overpass (alt_names tried as fallback).
# optional: true -> small/obscure; missing geometry is tolerated by validate.py.

