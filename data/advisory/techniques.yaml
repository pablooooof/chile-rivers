# EDITORIAL layer — NOT regulatory. Species presence and what to fish with,
# per water body and month. Gear restrictions from the regulations layer always
# override anything here.
#
# presence: species with an actual fishery in each water body (editorial, based
#   on regulations that name them, INVASAL/Subpesca chinook distribution studies
#   — northern limit cuenca del Toltén, Imperial establishing, Valdivia derived —
#   and angling literature). Central-Chile waters have NO salmon.
# waterbodies: river/lake-SPECIFIC monthly guidance (only where the fishery is
#   documented well enough to say something specific).
# general: fallback guidance, shown with an explicit "general, not specific to
#   this water" label, filtered by the water's species presence via `applies`.

species_names:
  trucha-arcoiris: "Trucha arcoíris"
  trucha-cafe: "Trucha café"
  salmon-chinook: "Salmón chinook"
  salmon-coho: "Salmón coho"
  salmon-salar: "Salmón del Atlántico"
  perca-trucha: "Percatrucha"
  pejerrey-argentino: "Pejerrey argentino"
  carpa: "Carpa"

presence:
  # Metropolitana — trucha sólo en cursos andinos; sin salmones (fuera de su rango)
  rio-maipo: [trucha-arcoiris, trucha-cafe, carpa]
  rio-mapocho: [trucha-arcoiris]
  rio-colorado-maipo: [trucha-arcoiris]
  rio-yeso: [trucha-arcoiris]
  rio-volcan-maipo: [trucha-arcoiris]
  rio-clarillo: [trucha-arcoiris, trucha-cafe]
  rio-molina: [trucha-arcoiris]
  embalse-el-yeso: [trucha-arcoiris]
  laguna-negra: [trucha-arcoiris, trucha-cafe]
  # O'Higgins — trucha en valles altos; Rapel es pesquería de aguas templadas
  rio-cachapoal: [trucha-arcoiris, trucha-cafe]
  rio-tinguiririca: [trucha-arcoiris, trucha-cafe]
  rio-pangal: [trucha-arcoiris]
  lago-rapel: [pejerrey-argentino, carpa]
  # La Araucanía — límite norte del chinook naturalizado (cuencas Toltén e Imperial)
