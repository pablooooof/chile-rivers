        1:  { fly: "Secas al atardecer en bahías calmas; caídas de hormigas.", fly_en: "Evening dries in calm bays; ant falls.",
              spin: "Lures naturales al amanecer.", spin_en: "Natural-color lures at dawn." }
  rio-futaleufu:
    - species: "Trucha arcoíris y café"
      species_en: "Rainbow & brown trout"
      months:
        11: { fly: "Apertura (1 nov, provincia de Palena): ninfas pesadas en agua turquesa grande.", fly_en: "Opening (Nov 1, Palena province): heavy nymphs in big turquoise water.",
              spin: "Minnows hundidos; cuidado con los rápidos clase V.", spin_en: "Sinking minnows; beware the class-V rapids." }
        12: { fly: "Secas atractoras grandes desde bote; arcoíris muy agresivas.", fly_en: "Big attractor dries from the boat; very aggressive rainbows.",
