# Canonical registry of water bodies shown on the map.
# id: stable slug used by regulations yaml and geometry filenames.
# osm_name: exact `name` tag to query in Overpass (alt_names tried as fallback).
# bbox: [S, W, N, E] — REQUIRED for ambiguous names (many Chilean rivers share
#   names, e.g. Río Blanco/Cholchol/Sur); fetch_geometry.py discards matches
#   whose geometry falls entirely outside the bbox.
# optional: true -> small/obscure; missing geometry is tolerated by build.py.

