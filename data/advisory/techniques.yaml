waterbodies:
  rio-petrohue:
    - species: "Salmón chinook"
      species_en: "Chinook salmon"
      months:
        11: { fly: "Primeros peces plateados; two-hand 8-9, T-11/T-14, Intruders oscuros.", fly_en: "First chrome fish; two-hand 8-9, T-11/T-14 tips, dark Intruders.",
              spin: "Spoons 30 g; pozones bajos. Prohibido motor encendido en todo el río.", spin_en: "30 g spoons in the lower pools. Running motors are banned on the whole river." }
        1:  { fly: "Corrida en aumento; sectores medios entre los saltos y la desembocadura.", fly_en: "Run building; mid sections between the falls and the mouth.",
              spin: "Spoons 30-40 g verde/chartreuse, recogida lenta y profunda.", spin_en: "30-40 g green/chartreuse spoons, slow deep retrieve." }
        2:  { fly: "Temporada alta; buscar agua de 1-2 m con corriente media.", fly_en: "Peak season; look for 1-2 m water with medium current.",
              spin: "Ídem enero; sólo 1 salmón de retención por jornada.", spin_en: "Same as January; only 1 salmon may be kept per day." }
        3:  { fly: "Peces coloreados, aún entran frescos con lluvias.", fly_en: "Colored fish; fresh ones still enter after rain.",
              spin: "Considerar devolución de peces oscuros.", spin_en: "Consider releasing dark fish." }
        4:  { fly: "Final de corrida; truchas grandes detrás de los desoves con perdigones y glo-bugs.", fly_en: "End of the run; big trout behind the redds on perdigons and glo-bugs.",
              spin: "Giratorias #4 cobre.", spin_en: "#4 copper spinners." }
      notes: "Corrida documentada de diciembre a abril; sector Los Patos cerrado."
      notes_en: "Run documented December-April; Los Patos sector is closed."
    - species: "Trucha arcoíris y café"
      species_en: "Rainbow & brown trout"
      months:
        11: { fly: "Ninfas pesadas en canaletas de lava; streamers olive.", fly_en: "Heavy nymphs in the lava channels; olive streamers.",
              spin: "Minnows hundidos; el agua es siempre fría y turquesa (glaciar).", spin_en: "Sinking minnows; the water is always cold and glacial turquoise." }
        12: { fly: "Secas atractoras (Chernobyl, Stimulator) con caída de tábanos.", fly_en: "Attractor dries (Chernobyl, Stimulator) once horseflies fall.",
              spin: "Giratorias #3.", spin_en: "#3 spinners." }
        1:  { fly: "Dry-dropper; truchas asociadas a estructura de lava.", fly_en: "Dry-dropper; trout hold on lava structure.",
              spin: "Lures pequeños, primeras horas.", spin_en: "Small lures, early hours." }
        3:  { fly: "Streamers y ninfas grandes; cafés agresivas.", fly_en: "Streamers and big nymphs; aggressive browns.",
              spin: "Minnows más grandes.", spin_en: "Larger minnows." }
  rio-puelo:
    - species: "Salmón chinook / coho / salar"
      species_en: "Chinook / coho / Atlantic salmon"
      months:
        9:  { fly: "Apertura anticipada (¡sólo devolución!): streamers grandes en pozones, swing profundo.", fly_en: "Early opening (catch & release only!): big streamers in the pools, deep swing.",
              spin: "Spoons pesados con anzuelo simple sin rebarba; todo se devuelve.", spin_en: "Heavy spoons with a single barbless hook; everything goes back." }
        11: { fly: "Desde el 2° viernes: retención de 1 salmón; two-hand en el sector bajo (Reloncaví).", fly_en: "From the 2nd Friday: 1 salmon may be kept; two-hand rods in the lower river (Reloncaví).",
              spin: "Spoons 30-40 g cerca del estuario.", spin_en: "30-40 g spoons near the estuary." }
        1:  { fly: "Chinook en el valle; salar/coho de escape cerca de la desembocadura.", fly_en: "Chinook up the valley; escaped salar/coho near the mouth.",
              spin: "Trolling liviano en el estuario donde esté permitido.", spin_en: "Light trolling in the estuary where allowed." }
        2:  { fly: "Temporada alta del chinook aguas arriba (sector Tagua Tagua).", fly_en: "Peak chinook upstream (Tagua Tagua sector).",
              spin: "Spoons XL en pozones profundos.", spin_en: "XL spoons in the deep pools." }
        3:  { fly: "Últimos frescos; truchas grandes comiendo huevos.", fly_en: "Last fresh fish; big trout eating eggs.",
              spin: "Giratorias cobre.", spin_en: "Copper spinners." }
      notes: "Temporada extendida hasta el 31 de mayo (cuenca Puelo/Rahue)."
      notes_en: "Season extended to May 31 (Puelo/Rahue basin)."
    - species: "Trucha arcoíris y café"
      species_en: "Rainbow & brown trout"
      months:
        12: { fly: "Agua turquesa grande: streamers con sink-tip desde bote; dries en orillas.", fly_en: "Big turquoise water: streamers on sink-tips from the boat; dries along the banks.",
              spin: "Minnows 9-11 cm.", spin_en: "9-11 cm minnows." }
        2:  { fly: "Terrestres en las orillas con viento; café grandes en estructura.", fly_en: "Terrestrials along windy banks; big browns on structure.",
              spin: "Lures naturales, atardecer.", spin_en: "Natural-color lures at dusk." }
        4:  { fly: "Streamers agresivos pre-desove.", fly_en: "Aggressive pre-spawn streamers.",
              spin: "Spoons cobre/naranja.", spin_en: "Copper/orange spoons." }
  rio-maullin:
    - species: "Salmón chinook / coho"
      species_en: "Chinook / coho salmon"
      months:
        12: { fly: "Entran los primeros chinook desde el estuario; swing con Intruders en pozones lentos.", fly_en: "First chinook enter from the estuary; swing Intruders through the slow pools.",
              spin: "Spoons pesados en el curso bajo (Las Quemas, Lolcura).", spin_en: "Heavy spoons in the lower river (Las Quemas, Lolcura)." }
        1:  { fly: "Corrida plena; río lento — buscar canales profundos.", fly_en: "Run in full; slow river — find the deep channels.",
              spin: "Trolling lento con rapalas hundidos donde esté permitido.", spin_en: "Slow trolling with sinking plugs where allowed." }
        2:  { fly: "Ídem; coho cerca de la barra en otoño temprano.", fly_en: "Same; coho near the bar in early autumn.",
              spin: "Spoons plateados.", spin_en: "Silver spoons." }
      notes: "Prohibida la pesca desde puentes; retención de 1 salmón desde nov."
      notes_en: "Fishing from bridges is banned; 1 salmon may be kept from Nov."
    - species: "Trucha arcoíris y café"
      species_en: "Rainbow & brown trout"
      months:
        9:  { fly: "C&R primaveral: streamers y ninfas en la salida del lago Llanquihue.", fly_en: "Spring C&R: streamers and nymphs at the Lago Llanquihue outlet.",
              spin: "Giratorias con anzuelo simple sin rebarba (obligatorio).", spin_en: "Spinners with a single barbless hook (mandatory)." }
        12: { fly: "Río de llanura tipo spring creek: secas al rise en tardes calmas.", fly_en: "Lowland spring-creek water: dries to risers on calm evenings.",
              spin: "Lures chicos, presentación silenciosa.", spin_en: "Small lures, quiet presentation." }
        2:  { fly: "Terrestres y damseles en los remansos con vegetación.", fly_en: "Terrestrials and damsels in weedy backwaters.",
              spin: "Primeras/últimas horas.", spin_en: "First/last light." }
  lago-llanquihue:
    - species: "Salar / coho / chinook (harling y orilla)"
      species_en: "Salar / coho / chinook (harling & shore)"
      months:
        9:  { fly: "Apertura C&R: streamers smolt sobre veriles y bocas (a >1.000 m de desembocaduras).", fly_en: "C&R opening: smolt streamers over drop-offs and mouths (>1,000 m from inlets).",
              spin: "Harling con cucharas plateadas; devolución obligatoria hasta nov.", spin_en: "Harling with silver spoons; mandatory release until Nov." }
        11: { fly: "Retención de 1 salmón desde el 2° viernes; línea hundida sobre los veriles.", fly_en: "1 salmon may be kept from the 2nd Friday; sunk lines over the drop-offs.",
              spin: "Trolling al amanecer frente a Ensenada y bocas de ríos.", spin_en: "Dawn trolling off Ensenada and the river mouths." }
        1:  { fly: "Peces profundos; shooting heads tipo 7.", fly_en: "Fish go deep; type-7 shooting heads.",
              spin: "Trolling con downrigger liviano.", spin_en: "Light downrigger trolling." }
        5:  { fly: "Extensión de mayo (si se renueva): C&R, streamers en bocas.", fly_en: "May extension (if renewed): C&R, streamers at the mouths.",
              spin: "C&R; cucharas plateadas.", spin_en: "C&R; silver spoons." }
    - species: "Trucha arcoíris y café"
      species_en: "Rainbow & brown trout"
      months:
        10: { fly: "Dragones y damseles cerca de bahías con vegetación.", fly_en: "Dragon and damsel nymphs near weedy bays.",
